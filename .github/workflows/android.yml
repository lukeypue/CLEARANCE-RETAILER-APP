name: Android test build

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore test signing identity
        id: test-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clearance-test-signing-v1
      - name: Catalog behavior tests
        run: bash scripts/test-domain.sh
      - name: Android lint and APK
        run: ./gradlew lintDebug assembleDebug --no-daemon
      - name: Stage installation file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Clearance-Retailer-v0.1.0-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Clearance-Retailer-v0.1.0-test
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
